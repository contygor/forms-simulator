services:
  postgres:
    image: postgres:16-alpine
    container_name: forms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: formdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: suasenha
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - forms-private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d formdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    container_name: forms-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      Database__ApplyMigrations: "true"
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=formdb;Username=postgres;Password=suasenha
      Cors__AllowedOrigins__0: http://localhost:3000
      Cors__AllowedOrigins__1: http://localhost:5173
      Cors__AllowedOrigins__2: http://localhost:8080
    ports:
      - "8080:8080"
    networks:
      - forms-private
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:

networks:
  forms-private:
    driver: bridge
